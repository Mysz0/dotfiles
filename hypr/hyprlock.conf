source = ./hyprlock-colors.conf

$font = JetBrains Mono

general {
    hide_cursor = true
    no_fade_in = false
    grace = 1
    disable_loading_bar = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $image
    color = $background
    blur_passes = 3 
    blur_size = 8
    crossfade_time = 0.2
}

# --- TOP LEFT CORNER WIDGET (Fixed & Expanded) ---

# Profile Picture
image {
    monitor =
    path = /home/dog/Pictures/profile_picture.jpg 
    size = 85
    rounding = 12
    border_size = 2
    border_color = $entry_border_color
    position = 40, -40
    halign = left
    valign = top
}

# System Info (Fixed: Removed <span> tags)
label {
    monitor =
    text = cmd[] echo -e "$USER @ arch\n$(uname -r)\nPkgs: $(pacman -Q | wc -l)\nUp: $(uptime -p | sed 's/up //')"
    color = $text_color
    font_size = 11
    font_family = $font Bold
    position = 145, -50
    halign = left
    valign = top
}

# --- CENTER CLOCK (With Shadow) ---

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = $text_color
    font_size = 180
    font_family = $font ExtraBold
    shadow_passes = 3
    shadow_size = 4
    position = 0, 120
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $text_color
    font_size = 180
    font_family = $font ExtraBold
    shadow_passes = 3
    shadow_size = 4
    position = 0, -100
    halign = center
    valign = center
}

# --- LOWER INFO BLOCK ---

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text_color
    font_size = 22
    font_family = $font Bold
    position = 0, 360
    halign = center
    valign = bottom
}

# PLAYER STATUS (MPRIS)
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/player-status.sh)"
    color = $text_color
    font_size = 12
    font_family = $font
    position = 0, 240
    halign = center
    valign = bottom
}

# SMART GREETING
label {
    monitor =
    text = cmd[] echo "Good $(date +%H | awk '{if ($1 < 12) print "Morning"; else if ($1 < 18) print "Afternoon"; else print "Evening"}'), $DESC"
    color = $text_color
    font_size = 16
    font_family = $font Italic
    position = 0, 170
    halign = center
    valign = bottom
}

# RANDOM QUOTE / FOOTNOTE (New Feature)
label {
    monitor =
    text = cmd[] fortune -s | head -n 1 || echo "Welcome back, $USER"
    color = rgba(255, 255, 255, 0.4)
    font_size = 10
    font_family = $font Italic
    position = 0, 20
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    inner_color = $entry_background_color
    outer_color = $entry_border_color
    check_color = rgba(A15561E6)
    fail_color = rgba(A15561E6)
    font_color = $text_color
    fade_on_empty = true
    rounding = -1
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 70
    halign = center
    valign = bottom
}
